# Push to main → FTP into the Namecheap addon docroot for emilmottola.com.
# Secrets (repo Settings → Secrets and variables → Actions):
#   FTP_SERVER     e.g. server293.web-hosting.com
#   FTP_USERNAME   cPanel FTP user whose home is /home/tesscrri/emilmottola.com
#   FTP_PASSWORD
name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-namecheap
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require FTP secrets
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "Set repo Actions secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, then re-run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github*/**
            **/README.md
            **/.nojekyll
